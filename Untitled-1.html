<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عبق الذهب | عطور</title>
<meta name="description" content="محل عطور راقية: عود، مسك، وعطور فرنسية. اطلب عبر واتساب.">
<meta name="theme-color" content="#14110e">
<!--
  طريقة التعديل: غيّر القيم داخل الكائن CONFIG في الأسفل فقط (الاسم، الأرقام، الروابط، الألوان، المنتجات)، والصفحة تُبنى منه تلقائيًا.
-->
<style>
  /* الألوان تُحقن من CONFIG عبر JavaScript؛ هذه قيم احتياطية فقط */
  :root{
    --bg:#14110e; --panel:#1d1915; --gold:#c9a24b; --text:#efe6d4; --muted:#a89c86;
    --line:rgba(201,162,75,.28);
    --serif:"Amiri","Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
    --sans:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.8;font-size:17px}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .wrap{width:min(1100px,92%);margin-inline:auto}
  section{padding:84px 0}
  h2{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.6rem);color:var(--gold);font-weight:700;margin-bottom:12px;line-height:1.3}
  .lead{color:var(--muted);max-width:60ch}
  .head{margin-bottom:38px}
  .site-nav{position:sticky;top:0;z-index:30;background:rgba(20,17,14,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{font-family:var(--serif);color:var(--gold);font-size:1.35rem;font-weight:700;white-space:nowrap}
  .nav-links{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:.95rem}
  .nav-links a:hover{color:var(--gold)}
  .cart-trigger{position:relative;white-space:nowrap}
  .cart-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:50%;background:var(--text);color:var(--bg);font-size:.78rem;font-weight:700}
  .hero{min-height:calc(100svh - 68px)}
  .hero .wrap{padding-block:30px}
  .hero .mark{font-size:clamp(4rem,16vw,9rem)}

  /* الأزرار */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:999px;
       border:1px solid var(--gold);color:var(--gold);font-family:inherit;font-size:1rem;cursor:pointer;background:transparent;
       transition:background .2s,color .2s}
  .btn:hover{background:var(--gold);color:var(--bg)}
  .btn.solid{background:var(--gold);color:var(--bg);font-weight:700}
  .btn.solid:hover{background:var(--text);border-color:var(--text)}

  /* الغلاف */
  .hero{min-height:calc(100svh - 68px);display:grid;place-items:center;text-align:center;padding:60px 0;
        background:radial-gradient(ellipse at 50% 38%,rgba(201,162,75,.20),transparent 62%),var(--bg)}
  .mark{font-family:var(--serif);font-size:clamp(5rem,20vw,11rem);line-height:1;color:var(--gold);
        text-shadow:0 0 60px rgba(201,162,75,.35);animation:rise 1.2s ease both}
  .hero h1{font-family:var(--serif);font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:400;margin:6px 0 10px;animation:rise 1.2s .15s ease both}
  .hero p{color:var(--muted);margin-bottom:30px;animation:rise 1.2s .3s ease both}
  .hero .btn{animation:rise 1.2s .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* من نحن */
  .about{background:var(--panel);border-block:1px solid var(--line)}
  .about p{max-width:68ch;font-size:1.08rem}

  /* المنتجات */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card img{aspect-ratio:1/1;object-fit:cover;width:100%;background:#2a241d}
  .card .body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h3{font-family:var(--serif);font-size:1.35rem;font-weight:700}
  .price{color:var(--gold);font-weight:700;margin-bottom:10px}
  .card .btn{margin-top:auto;padding:10px 18px;font-size:.95rem}
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  .toolbar input,.toolbar select,.checkout-form input,.checkout-form textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:12px 14px;font:inherit}
  .toolbar input{flex:1 1 240px}
  .toolbar select{flex:0 1 190px}
  .toolbar input::placeholder,.checkout-form input::placeholder,.checkout-form textarea::placeholder{color:var(--muted)}
  .card .description{color:var(--muted);font-size:.94rem;min-height:3.2em}
  .card .price{margin-bottom:10px}
  .no-results{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

  /* المعرض */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .gallery button{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:none;padding:0;cursor:zoom-in}
  .gallery img{aspect-ratio:1/1;object-fit:cover;width:100%;transition:transform .4s}
  .gallery button:hover img{transform:scale(1.05)}
  #lightbox{position:fixed;inset:0;background:rgba(10,8,6,.92);display:none;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
  #lightbox.open{display:grid}
  #lightbox img{max-height:88vh;border-radius:10px;border:1px solid var(--line)}
  .dialog-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;place-items:center;padding:16px}
  .dialog-backdrop.open{display:grid}
  .cart-dialog{width:min(620px,100%);max-height:min(90vh,850px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 20px 70px #0009}
  .dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .dialog-heading h2{margin:0}
  .icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--text);font:inherit;cursor:pointer}
  .cart-items{list-style:none}
  .cart-item{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .cart-item img{width:64px;height:64px;object-fit:cover;border-radius:8px}
  .cart-item h3{font-family:var(--serif);font-size:1.1rem}
  .cart-item small{color:var(--muted)}
  .quantity-controls{display:flex;align-items:center;gap:8px;margin-top:6px}
  .quantity-controls button{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--text);cursor:pointer}
  .remove-item{color:#ef9a9a;background:none;border:0;cursor:pointer;font:inherit;font-size:.88rem}
  .cart-total{display:flex;justify-content:space-between;padding:18px 0;font-size:1.12rem;font-weight:700}
  .checkout-form{display:grid;gap:12px}
  .checkout-form textarea{min-height:86px;resize:vertical}
  .checkout-form .btn{width:100%}
  .empty-cart{text-align:center;color:var(--muted);padding:24px 0}
  .notice{min-height:1.5em;color:var(--muted);font-size:.9rem}

  /* ساعات العمل */
  .hours{background:var(--panel);border-block:1px solid var(--line)}
  .hours ul{list-style:none;max-width:460px}
  .hours li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .hours li span:last-child{color:var(--gold)}
  .hours li.today{color:var(--gold);font-weight:700}

  /* التواصل */
  .contact-list{display:flex;flex-wrap:wrap;gap:14px}

  footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:.92rem}
  footer b{font-family:var(--serif);color:var(--gold);font-size:1.2rem}

  /* زر واتساب العائم */
  .fab{position:fixed;bottom:20px;inset-inline-start:20px;width:58px;height:58px;border-radius:50%;background:#25d366;
       display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.5);z-index:40;transition:transform .2s}
  .fab:hover{transform:scale(1.08)}
  .fab svg{width:32px;height:32px;fill:#fff}

  @media (max-width:700px){.nav-inner{flex-wrap:wrap;padding-block:10px}.nav-links{order:3;width:100%;justify-content:space-between;gap:8px;font-size:.88rem}.brand{font-size:1.18rem}.cart-trigger{padding:8px 14px}}
  @media (max-width:600px){section{padding:60px 0}body{font-size:16px}.cart-dialog{padding:18px}.cart-item{grid-template-columns:52px 1fr auto;gap:10px}.cart-item img{width:52px;height:52px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<main id="app"></main>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب"></a>
<div id="lightbox" role="dialog" aria-label="عرض الصورة"><img alt=""></div>
<div class="dialog-backdrop" id="cart-backdrop">
  <section class="cart-dialog" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <div class="dialog-heading"><h2 id="cart-title">سلة التسوق</h2><button class="icon-btn" id="close-cart" type="button" aria-label="إغلاق السلة">×</button></div>
    <ul class="cart-items" id="cart-items"></ul>
    <p class="empty-cart" id="empty-cart">سلتك فارغة حاليًا. أضف عطرًا من المنتجات للبدء.</p>
    <div id="checkout-area" hidden>
      <div class="cart-total"><span>الإجمالي</span><span id="cart-total"></span></div>
      <form class="checkout-form" id="checkout-form">
        <input name="customerName" autocomplete="name" placeholder="الاسم الكامل" required>
        <input name="customerPhone" type="tel" autocomplete="tel" placeholder="رقم الهاتف" required>
        <textarea name="customerAddress" autocomplete="street-address" placeholder="عنوان التوصيل والمدينة" required></textarea>
        <button class="btn solid" type="submit">تأكيد الطلب عبر واتساب</button>
        <p class="notice">سيتم إرسال تفاصيل طلبك إلى المتجر عبر واتساب لتأكيد التوفر والتوصيل.</p>
      </form>
    </div>
  </section>
</div>

<script>
/* =====================================================================
   CONFIG: كل ما تحتاج تعديله موجود هنا. لا حاجة للمس بقية الملف.
   ===================================================================== */
const CONFIG = {
  name: "عبق الذهب",                         // اسم المحل
  logo: "عبق",                               // الشعار النصي (يظهر كبيرًا في الغلاف)
  slogan: "عطور تحفظ الذكريات",              // العبارة تحت الاسم
  about: "نختار لكم أجود أنواع العود والمسك والعطور الفرنسية، ونقدّمها بعناية في زجاجات أنيقة. نستقبلكم في محلنا لتجربة العطر المناسب لكم، أو اطلبوه عبر واتساب ونوصله إليكم.",

  phone: "+213555000000",                    // استبدله برقم المتجر الحقيقي قبل النشر
  whatsapp: "213555000000",                  // استبدله برقم واتساب الحقيقي بصيغة دولية قبل النشر
  whatsappMessage: "السلام عليكم، أريد الاستفسار عن عطوركم.", // رسالة الزر العائم والغلاف

  instagram: "",                               // رابط إنستغرام الحقيقي (اختياري)
  facebook: "",                                // رابط فيسبوك الحقيقي (اختياري)
  mapUrl: "https://www.google.com/maps?q=El+Bayadh,Algeria", // حدّثه لموقع المحل الدقيق
  address: "شارع الاستقلال، البيّض",           // حدّث العنوان قبل النشر

  colors: {                                  // ألوان الصفحة
    bg: "#14110e",     // الخلفية
    panel: "#1d1915",  // خلفية البطاقات والأقسام
    gold: "#c9a24b",   // الذهبي
    text: "#efe6d4",   // لون النص
    muted: "#a89c86"   // النص الثانوي
  },

  currency: "د.ج",                           // العملة تُضاف بعد السعر

  /* المنتجات: الاسم، السعر، التصنيف، الوصف، والصورة المحلية داخل مجلد images. */
  products: [
    { name: "عود ملكي", price: 12000, category: "عود", description: "نفحات عود دافئة وفاخرة لمناسباتك.", image: "images/oud.jpg" },
    { name: "مسك أبيض", price: 4500, category: "مسك", description: "رائحة ناعمة ونظيفة للاستخدام اليومي.", image: "images/musk.jpg" },
    { name: "عنبر فاخر", price: 7800, category: "شرقي", description: "عنبر غني بلمسة شرقية تدوم طويلًا.", image: "images/amber.jpg" },
    { name: "ورد طائفي", price: 5200, category: "زهري", description: "عبير وردي أنيق ومنعش.", image: "images/rose.jpg" },
    { name: "صندل هندي", price: 6300, category: "شرقي", description: "خشب الصندل بعبير هادئ ومتوازن.", image: "images/sandal.jpg" },
    { name: "عطر الليل", price: 9500, category: "عطور", description: "عطر جذاب بلمسات مسائية راقية.", image: "images/night.jpg" }
  ],

  /* معرض الصور: استبدل الروابط بصور محلك (نفس طريقة صور المنتجات) */
  gallery: [
    "images/gallery-1.jpg",
    "images/gallery-2.jpg",
    "images/gallery-3.jpg",
    "images/gallery-4.jpg",
    "images/gallery-5.jpg",
    "images/gallery-6.jpg"
  ],

  /* ساعات العمل: day رقم اليوم (0 = الأحد ... 6 = السبت) لتمييز اليوم الحالي */
  hours: [
    { day: 6, label: "السبت",    time: "9:00 – 21:00" },
    { day: 0, label: "الأحد",    time: "9:00 – 21:00" },
    { day: 1, label: "الاثنين",  time: "9:00 – 21:00" },
    { day: 2, label: "الثلاثاء", time: "9:00 – 21:00" },
    { day: 3, label: "الأربعاء", time: "9:00 – 21:00" },
    { day: 4, label: "الخميس",   time: "9:00 – 22:00" },
    { day: 5, label: "الجمعة",   time: "15:00 – 22:00" }
  ]
};

/* ============================ بناء الصفحة ============================ */

// إنشاء عنصر بسرعة: el("div", {class:"x"}, ...أبناء)
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  kids.flat().forEach(k => n.append(k));
  return n;
}

// رابط واتساب برسالة جاهزة
function waLink(msg) {
  return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);
}

// تطبيق الألوان
const c = CONFIG.colors, root = document.documentElement.style;
root.setProperty("--bg", c.bg);
root.setProperty("--panel", c.panel);
root.setProperty("--gold", c.gold);
root.setProperty("--text", c.text);
root.setProperty("--muted", c.muted);
document.title = CONFIG.name + " | عطور";
document.querySelector('meta[name="theme-color"]').content = c.bg;

const app = document.getElementById("app");
const formatPrice = value => new Intl.NumberFormat("ar-DZ").format(Number(value)) + " " + CONFIG.currency;
let cart = {};

app.append(
  el("nav", { class: "site-nav", "aria-label": "التنقل الرئيسي" },
    el("div", { class: "wrap nav-inner" },
      el("a", { class: "brand", href: "#top" }, CONFIG.name),
      el("div", { class: "nav-links" },
        el("a", { href: "#products" }, "المنتجات"),
        el("a", { href: "#about" }, "من نحن"),
        el("a", { href: "#gallery" }, "المعرض"),
        el("a", { href: "#location" }, "موقعنا"),
        el("a", { href: "#contact" }, "تواصل معنا")),
      el("button", { class: "btn cart-trigger", id: "open-cart", type: "button", "aria-haspopup": "dialog" },
        "السلة ", el("span", { class: "cart-count", id: "cart-count", "aria-live": "polite" }, "0"))
    )
  )
);

// عنوان قسم
const head = (id, title, sub) =>
  el("div", { class: "head" }, el("h2", { id }, title), sub ? el("p", { class: "lead" }, sub) : "");

// 1) الغلاف
app.append(
  el("header", { class: "hero", id: "top" },
    el("div", { class: "wrap" },
      el("div", { class: "mark", "aria-hidden": "true" }, CONFIG.logo),
      el("h1", {}, CONFIG.name),
      el("p", {}, CONFIG.slogan),
      el("a", { class: "btn solid", href: waLink(CONFIG.whatsappMessage), target: "_blank", rel: "noopener" }, "تواصل عبر واتساب")
    )
  )
);

// 2) من نحن
app.append(
  el("section", { class: "about", id: "about" },
    el("div", { class: "wrap" }, head("about-t", "من نحن"), el("p", {}, CONFIG.about))
  )
);

// 3) المنتجات والبحث والتصنيف والسلة
const searchInput = el("input", { type: "search", id: "product-search", placeholder: "ابحث عن عطر...", "aria-label": "ابحث عن منتج" });
const categorySelect = el("select", { id: "product-category", "aria-label": "تصفية حسب التصنيف" },
  el("option", { value: "" }, "كل التصنيفات"));
[...new Set(CONFIG.products.map(p => p.category))].forEach(category =>
  categorySelect.append(el("option", { value: category }, category))
);
const products = el("div", { class: "grid" });
const noResults = el("p", { class: "no-results", hidden: "" }, "لا توجد منتجات تطابق بحثك.");
const cartItems = document.getElementById("cart-items");
const cartCount = document.getElementById("cart-count");
const cartTotal = document.getElementById("cart-total");
const emptyCart = document.getElementById("empty-cart");
const checkoutArea = document.getElementById("checkout-area");
const cartBackdrop = document.getElementById("cart-backdrop");

CONFIG.products.forEach((p, index) => {
  const img = el("img", { src: p.image, alt: p.name, loading: "lazy" });
  img.addEventListener("error", () => { img.alt = "الصورة غير متاحة: " + p.name; });
  products.append(
    el("article", { class: "card", "data-name": p.name, "data-category": p.category },
      img,
      el("div", { class: "body" },
        el("h3", {}, p.name),
        el("p", { class: "description" }, p.description),
        el("div", { class: "price" }, formatPrice(p.price)),
        el("button", { class: "btn", type: "button", "data-add": String(index) }, "أضف إلى السلة")
      )
    )
  );
});

function updateCart() {
  cartItems.replaceChildren();
  const entries = Object.entries(cart).filter(([, quantity]) => quantity > 0);
  const itemCount = entries.reduce((sum, [, quantity]) => sum + quantity, 0);
  const total = entries.reduce((sum, [index, quantity]) => sum + Number(CONFIG.products[index].price) * quantity, 0);
  cartCount.textContent = String(itemCount);
  cartTotal.textContent = formatPrice(total);
  emptyCart.hidden = entries.length > 0;
  checkoutArea.hidden = entries.length === 0;
  entries.forEach(([index, quantity]) => {
    const product = CONFIG.products[index];
    cartItems.append(
      el("li", { class: "cart-item" },
        el("img", { src: product.image, alt: "" }),
        el("div", {},
          el("h3", {}, product.name),
          el("small", {}, formatPrice(product.price)),
          el("div", { class: "quantity-controls" },
            el("button", { type: "button", "data-quantity": index, "data-change": "-1", "aria-label": "تقليل كمية " + product.name }, "−"),
            el("span", { "aria-label": "الكمية" }, String(quantity)),
            el("button", { type: "button", "data-quantity": index, "data-change": "1", "aria-label": "زيادة كمية " + product.name }, "+")
          )
        ),
        el("button", { class: "remove-item", type: "button", "data-remove": index }, "حذف")
      )
    );
  });
}

function filterProducts() {
  const query = searchInput.value.trim().toLocaleLowerCase("ar");
  const category = categorySelect.value;
  let visible = 0;
  products.querySelectorAll(".card").forEach(card => {
    const matches = card.dataset.name.toLocaleLowerCase("ar").includes(query)
      && (!category || card.dataset.category === category);
    card.hidden = !matches;
    if (matches) visible++;
  });
  noResults.hidden = visible > 0;
}

products.addEventListener("click", event => {
  const button = event.target.closest("[data-add]");
  if (!button) return;
  const index = button.dataset.add;
  cart[index] = (cart[index] || 0) + 1;
  updateCart();
  button.textContent = "أُضيف إلى السلة ✓";
  window.setTimeout(() => { button.textContent = "أضف إلى السلة"; }, 1200);
});
cartItems.addEventListener("click", event => {
  const changeButton = event.target.closest("[data-quantity]");
  const removeButton = event.target.closest("[data-remove]");
  if (changeButton) {
    const index = changeButton.dataset.quantity;
    cart[index] = (cart[index] || 0) + Number(changeButton.dataset.change);
    if (cart[index] <= 0) delete cart[index];
    updateCart();
  } else if (removeButton) {
    delete cart[removeButton.dataset.remove];
    updateCart();
  }
});
searchInput.addEventListener("input", filterProducts);
categorySelect.addEventListener("change", filterProducts);
const openCart = () => {
  cartBackdrop.classList.add("open");
  document.getElementById("close-cart").focus();
};
const closeCart = () => {
  cartBackdrop.classList.remove("open");
  document.getElementById("open-cart").focus();
};
document.getElementById("open-cart").addEventListener("click", openCart);
document.getElementById("close-cart").addEventListener("click", closeCart);
cartBackdrop.addEventListener("click", event => {
  if (event.target === cartBackdrop) closeCart();
});
document.getElementById("checkout-form").addEventListener("submit", event => {
  event.preventDefault();
  if (!event.currentTarget.reportValidity()) return;
  const formData = new FormData(event.currentTarget);
  const orderLines = Object.entries(cart).map(([index, quantity]) => {
    const product = CONFIG.products[index];
    return `- ${product.name} × ${quantity}: ${formatPrice(Number(product.price) * quantity)}`;
  });
  const total = Object.entries(cart).reduce((sum, [index, quantity]) =>
    sum + Number(CONFIG.products[index].price) * quantity, 0);
  const message = [
    "السلام عليكم، أود تأكيد هذا الطلب:",
    ...orderLines,
    `الإجمالي: ${formatPrice(total)}`,
    `الاسم: ${formData.get("customerName")}`,
    `الهاتف: ${formData.get("customerPhone")}`,
    `العنوان: ${formData.get("customerAddress")}`
  ].join("\n");
  window.location.href = waLink(message);
});

app.append(el("section", { id: "products" }, el("div", { class: "wrap" },
  head("products-t", "منتجاتنا", "اختر عطرك وأضفه إلى سلتك لإرسال طلبك مباشرة."),
  el("div", { class: "toolbar" }, searchInput, categorySelect), products, noResults
)));

// 4) معرض الصور (مع تكبير عند الضغط)
const gal = el("div", { class: "gallery" });
const lb = document.getElementById("lightbox"), lbImg = lb.querySelector("img");
CONFIG.gallery.forEach((src, i) => {
  const b = el("button", { type: "button", "aria-label": "تكبير الصورة " + (i + 1) },
    el("img", { src, alt: "صورة من المحل " + (i + 1), loading: "lazy" }));
  b.addEventListener("click", () => { lbImg.src = src; lb.classList.add("open"); });
  gal.append(b);
});
lb.addEventListener("click", () => lb.classList.remove("open"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    lb.classList.remove("open");
    if (cartBackdrop.classList.contains("open")) closeCart();
  }
});
app.append(el("section", { id: "gallery" }, el("div", { class: "wrap" }, head("gallery-t", "معرض الصور"), gal)));

// 5) ساعات العمل (تمييز اليوم الحالي)
const today = new Date().getDay();
const ul = el("ul", {});
CONFIG.hours.forEach(h => ul.append(
  el("li", { class: h.day === today ? "today" : "" }, el("span", {}, h.label), el("span", {}, h.time))
));
app.append(el("section", { class: "hours", id: "hours" }, el("div", { class: "wrap" }, head("hours-t", "ساعات العمل"), ul)));

// 6) الموقع
app.append(
  el("section", { id: "location" },
    el("div", { class: "wrap" },
      head("location-t", "موقعنا", CONFIG.address),
      el("a", { class: "btn solid", href: CONFIG.mapUrl, target: "_blank", rel: "noopener" }, "افتح في خرائط Google")
    )
  )
);

// 7) التواصل
const links = [
  ["واتساب",   waLink(CONFIG.whatsappMessage)],
  ["اتصال: " + CONFIG.phone.replace("+", ""), "tel:" + CONFIG.phone]
];
if (CONFIG.instagram) links.push(["إنستغرام", CONFIG.instagram]);
if (CONFIG.facebook) links.push(["فيسبوك", CONFIG.facebook]);
const cl = el("div", { class: "contact-list" });
links.forEach(([t, h]) => cl.append(el("a", { class: "btn", href: h, target: h.startsWith("tel:") ? "_self" : "_blank", rel: "noopener" }, t)));
app.append(el("section", { class: "about", id: "contact" }, el("div", { class: "wrap" }, head("contact-t", "تواصل معنا", "يسعدنا خدمتكم في أي وقت."), cl)));

// 8) التذييل
app.append(
  el("footer", {}, el("div", { class: "wrap" },
    el("b", {}, CONFIG.name),
    el("p", {}, "© " + new Date().getFullYear() + " جميع الحقوق محفوظة")))
);

</script>
